<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lyra Private Body &amp; Skin</title>
<meta name="theme-color" content="#18110b">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--bg:#18110b;--bg2:#291c13;--gold:#c9a45c;--gold-dim:#8a6d3b;--ink:#e9d9b6;--line:rgba(201,164,92,.35)}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:radial-gradient(ellipse at 50% 30%,var(--bg2),var(--bg) 70%) fixed,var(--bg);color:var(--ink);font-family:"Cormorant Garamond",Georgia,serif;font-size:19px;line-height:1.5;display:flex;flex-direction:column;align-items:center;padding:12px 22px 36px;text-align:center}
.lang{align-self:flex-end;font-size:16px;letter-spacing:.12em;color:var(--gold-dim)}
.lang button{background:none;border:0;font:inherit;letter-spacing:inherit;color:inherit;cursor:pointer;padding:8px 6px}
.lang button[aria-pressed=true]{color:var(--gold);border-bottom:1px solid var(--gold)}
.logo{width:min(78vw,340px);max-height:44vh;object-fit:contain;-webkit-mask-image:radial-gradient(ellipse at center,#000 55%,transparent 98%);mask-image:radial-gradient(ellipse at center,#000 55%,transparent 98%)}
main{width:100%;max-width:380px;margin-top:6px}
h1{font-weight:400;font-style:italic;font-size:24px;color:var(--gold);margin-bottom:4px}
.sub{color:var(--gold-dim);font-size:17px;margin-bottom:22px}
.key{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 8px;margin-bottom:22px}
.key small{display:block;font-style:italic;color:var(--gold-dim);font-size:16px}
.key output{display:block;font-size:24px;letter-spacing:.04em;color:var(--ink);word-break:break-all;margin-top:2px}
.btn{display:block;width:100%;padding:15px 12px;margin-bottom:12px;font:inherit;font-size:19px;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;cursor:pointer;border:1px solid var(--gold);transition:background .2s,color .2s}
.copy{background:var(--gold);color:var(--bg)}
.zelle{background:transparent;color:var(--gold)}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible,.lang button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.btn.done{background:transparent;color:var(--gold)}
.hint{font-style:italic;color:var(--gold-dim);font-size:16px;margin-top:10px}
</style>
</head>

<main>
  <h1 data-k="title">Pay with Zelle</h1>
  <p class="sub" data-k="sub">Copy the key, then paste it in your bank's Zelle.</p>
  <div class="key">
    <small data-k="keyLabel">Zelle key</small>
    <output id="key">euacarolina1@gmail.com</output>
  </div>
  <button class="btn copy" id="copy" data-k="copy">Copy key</button>
  <a class="btn zelle" href="https://www.zellepay.com/get-started" data-k="open">Open Zelle</a>
  <p class="hint" data-k="hint">In your bank app: Zelle → Send → paste the key.</p>
</main>
<script>
var T={
 en:{title:"Pay with Zelle",sub:"Copy the key, then paste it in your bank's Zelle.",keyLabel:"Zelle key",copy:"Copy key",copied:"Copied",open:"Open Zelle",hint:"In your bank app: Zelle → Send → paste the key."},
 pt:{title:"Pagar com Zelle",sub:"Copie a chave e cole no Zelle do seu banco.",keyLabel:"Chave Zelle",copy:"Copiar chave",copied:"Copiado",open:"Abrir Zelle",hint:"No app do seu banco: Zelle → Enviar → cole a chave."}
};
var lang=(navigator.language||"en").toLowerCase().indexOf("pt")===0?"pt":"en";
function set(l){
  lang=l;document.documentElement.lang=l;
  document.querySelectorAll("[data-k]").forEach(function(e){e.textContent=T[l][e.dataset.k]});
  document.getElementById("en").setAttribute("aria-pressed",l==="en");
  document.getElementById("pt").setAttribute("aria-pressed",l==="pt");
}
document.getElementById("en").onclick=function(){set("en")};
document.getElementById("pt").onclick=function(){set("pt")};
document.getElementById("copy").onclick=function(){
  var b=this,k=document.getElementById("key").textContent.trim();
  function ok(){b.textContent=T[lang].copied;b.classList.add("done");setTimeout(function(){b.textContent=T[lang].copy;b.classList.remove("done")},2000)}
  function fb(){var t=document.createElement("textarea");t.value=k;document.body.appendChild(t);t.select();try{document.execCommand("copy");ok()}catch(e){}document.body.removeChild(t)}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(k).then(ok,fb)}else{fb()}
};
set(lang);
</script>
